<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Confira o encarte de ofertas da semana do Supermercado Irene.">
  <title>Ofertas da semana | Supermercado Irene</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #242424; font-family: Arial, sans-serif; line-height: 1.5; }
    main { width: 100%; max-width: 1100px; margin-inline: auto; padding-bottom: 24px; }
    header { padding: 20px 16px 12px; text-align: center; }
    h1 { margin: 0; font-size: clamp(1.25rem, 4vw, 1.75rem); }
    header p { margin: 6px 0 0; }
    .hint { color: #555; font-size: .875rem; }
    figure { margin: 0 0 20px; }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: 8px 16px; text-align: center; }
    a { display: inline-block; padding: 10px 4px; color: #075736; text-underline-offset: 3px; }
    a:hover { color: #032f1c; }
    a:focus-visible { outline: 3px solid #075736; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Ofertas da semana</h1>
      <p>Supermercado Irene</p>
      <p class="hint">Use dois dedos para ampliar o encarte no celular.</p>
    </header>
    <figure>
      <img src="Capa.jpeg" alt="Capa do encarte de ofertas da semana do Supermercado Irene" width="2480" height="3508" loading="eager" fetchpriority="high">
      <figcaption><a href="Capa.jpeg" target="_blank" rel="noopener" aria-label="Abrir imagem para ampliar — capa (nova aba)">Abrir imagem para ampliar</a></figcaption>
    </figure>
    <figure>
      <img src="Verso.jpeg" alt="Verso do encarte de ofertas da semana do Supermercado Irene" width="2480" height="3508" loading="lazy" decoding="async">
      <figcaption><a href="Verso.jpeg" target="_blank" rel="noopener" aria-label="Abrir imagem para ampliar — verso (nova aba)">Abrir imagem para ampliar</a></figcaption>
    </figure>
  </main>
</body>
</html>
